<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng nhập - Production Data Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/login.css" />
  </head>
  <body class="login-page">
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
          <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
            <div class="card-body p-4 p-md-5">
              <div class="text-center mb-4">
                <div class="brand-icon mx-auto mb-3 d-flex align-items-center justify-content-center overflow-hidden bg-transparent">
                  <img src="./images/321516476_449770387367145_728949342124126507_n.jpg" alt="Logo công ty" class="img-fluid" style="max-width: 100%; max-height: 100%; object-fit: contain;" />
                </div>
                <h1 class="h3 fw-bold">Đăng nhập hệ thống</h1>
                <p class="text-muted">Chỉ nhân viên được cấp tài khoản mới có thể truy cập.</p>
              </div>

              <form id="loginForm" method="post" novalidate>
                <div class="mb-3">
                  <label for="email" class="form-label">Email</label>
                  <input id="email" name="email" type="email" class="form-control form-control-lg" placeholder="you@company.com" autocomplete="email" required />
                  <div class="form-text text-danger mt-2" id="emailError"></div>
                </div>

                <div class="mb-3">
                  <label for="password" class="form-label">Mật khẩu</label>
                  <div class="input-group input-group-lg">
                    <input id="password" name="password" type="password" class="form-control" placeholder="••••••••" autocomplete="current-password" required />
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword" aria-label="Hiện / Ẩn mật khẩu">Hiện</button>
                  </div>
                  <div class="form-text text-danger mt-2" id="passwordError"></div>
                </div>

                <div class="d-flex justify-content-between align-items-center mb-3">
                  <div class="form-check">
                    <input class="form-check-input" type="checkbox" id="rememberMe" />
                    <label class="form-check-label" for="rememberMe">Nhớ đăng nhập</label>
                  </div>
                  <a href="#" id="forgotPasswordLink" class="text-decoration-none">Quên mật khẩu?</a>
                </div>

                <button type="submit" class="btn btn-primary btn-lg w-100">Đăng nhập</button>
              </form>

              <div id="messageBox" class="mt-4"></div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script>
      if (window.location.protocol === 'file:') {
        const form = document.getElementById('loginForm');
        const messageBox = document.getElementById('messageBox');
        form?.addEventListener('submit', (event) => {
          event.preventDefault();
          if (messageBox) {
            messageBox.className = 'alert alert-warning mt-4';
            messageBox.textContent = 'Không thể đăng nhập khi mở file trực tiếp. Hãy truy cập website HTTPS của hệ thống.';
          }
        });
      }
    </script>
    <script type="module" src="./js/login.js"></script>
  </body>
</html>
