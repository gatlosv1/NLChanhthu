<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lịch sử thao tác</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <div class="d-flex min-vh-100">
      <aside class="sidebar bg-dark text-white p-4">
        <div class="mb-4"><h2 class="h5 fw-bold">Production Data</h2><p class="text-secondary small mb-0">Lịch sử thao tác</p></div>
        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link" href="./production.html">Nhập liệu sản xuất</a>
          <a class="nav-link" href="./cong-tach-mui.html">Công tách múi</a>
          <a class="nav-link active" href="./history.html">Lịch sử thao tác</a>
          <a class="nav-link" href="./profile.html">Profile</a>
          <a class="nav-link admin-only" href="./settings.html" data-admin-only-link>⚙ Quản lý danh mục</a>
          <a class="nav-link" href="#" data-action="logout">Đăng xuất</a>
        </nav>
      </aside>
      <main class="flex-grow-1 bg-light p-3 p-lg-4">
        <header class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
          <div><p class="text-muted mb-1">Audit log</p><h1 class="h3 fw-bold mb-0">Lịch sử thao tác</h1></div>
          <div class="d-flex gap-2 flex-wrap"><button class="btn btn-outline-secondary btn-sm" id="reloadHistoryBtn">Tải lại</button><button class="btn btn-outline-success btn-sm" id="exportHistoryBtn">Tải CSV</button><button class="btn btn-outline-danger btn-sm d-none" id="cleanupHistoryBtn">Xóa log cũ</button></div>
        </header>
        <div id="oldLogsBanner" class="alert alert-warning d-none" role="alert">Có lịch sử cũ hơn 7 ngày. Hãy tải về rồi xóa để tiết kiệm dung lượng. <button class="btn btn-sm btn-warning ms-2" id="exportOldHistoryBtn">Tải log cũ</button></div>
        <section class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-body"><div class="row g-3 align-items-end"><div class="col-12 col-md-3"><label class="form-label small" for="fromDate">Từ ngày</label><input class="form-control form-control-sm" id="fromDate" type="date" /></div><div class="col-12 col-md-3"><label class="form-label small" for="toDate">Đến ngày</label><input class="form-control form-control-sm" id="toDate" type="date" /></div><div class="col-12 col-md-2"><label class="form-label small" for="userFilter">User</label><select class="form-select form-select-sm" id="userFilter"><option value="">Tất cả</option></select></div><div class="col-12 col-md-2"><label class="form-label small" for="actionFilter">Thao tác</label><select class="form-select form-select-sm" id="actionFilter"><option value="">Tất cả</option><option value="add">Thêm</option><option value="edit">Sửa</option><option value="delete">Xóa</option><option value="login">Đăng nhập</option><option value="logout">Đăng xuất</option><option value="export">Xuất</option><option value="import">Nhập</option><option value="save">Lưu</option></select></div><div class="col-12 col-md-2"><label class="form-label small" for="pageFilter">Trang</label><select class="form-select form-select-sm" id="pageFilter"><option value="">Tất cả</option><option value="congTachMui">Công tách múi</option><option value="production">Nhập liệu</option><option value="settings">Cài đặt</option><option value="auth">Auth</option></select></div><div class="col-12"><button class="btn btn-primary btn-sm" id="applyHistoryBtn">Lọc lịch sử</button><span class="small text-muted ms-2" id="historyStatus"></span></div></div></div></section>
        <section class="card border-0 shadow-sm rounded-4"><div class="table-responsive"><table class="table table-hover align-middle mb-0"><thead><tr><th>Thời gian</th><th>Người dùng</th><th>Trang</th><th>Thao tác</th><th>Chi tiết</th></tr></thead><tbody id="historyBody"><tr><td colspan="5" class="text-center text-muted py-4">Đang tải...</td></tr></tbody></table></div></section>
      </main>
    </div>
    <script type="module" src="./js/history.js"></script>
    <script type="module" src="./js/logout.js"></script>
  </body>
</html>
