<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản lý danh mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <div class="d-flex min-vh-100">
      <aside class="sidebar bg-dark text-white p-4">
        <div class="mb-4">
          <h2 class="h5 fw-bold">Production Data</h2>
          <p class="text-secondary small mb-0">Quản lý danh mục</p>
        </div>
        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link" href="./production.html">Nhập liệu sản xuất</a>
          <a class="nav-link active" href="./settings.html">⚙ Quản lý danh mục</a>
          <a class="nav-link" href="#" data-action="logout">Đăng xuất</a>
        </nav>
      </aside>

      <main class="flex-grow-1 bg-light p-4">
        <header class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
          <div>
            <p class="text-muted mb-1">Quản trị</p>
            <h1 class="h3 fw-bold mb-0">Quản lý danh mục</h1>
          </div>
        </header>

        <div class="card border-0 shadow-sm rounded-4">
          <div class="card-body">
            <ul class="nav nav-tabs" id="settingsTabs" role="tablist">
              <li class="nav-item" role="presentation"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabNhaCungCap" type="button">Nhà cung cấp</button></li>
              <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabVung" type="button">Vùng nguyên liệu</button></li>
              <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabLoaiNguyenLieu" type="button">Loại nguyên liệu</button></li>
              <li class="nav-item" role="presentation"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabLoaiSanPham" type="button">Loại sản phẩm</button></li>
            </ul>
            <div class="tab-content mt-3">
              <div class="tab-pane fade show active" id="tabNhaCungCap">
                <div id="nhaCungCapList" class="list-group"></div>
                <form id="nhaCungCapForm" class="row g-2 mt-3">
                  <div class="col-md-3"><input class="form-control" name="ma" placeholder="Mã" required /></div>
                  <div class="col-md-6"><input class="form-control" name="ten" placeholder="Tên" required /></div>
                  <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Thêm</button></div>
                </form>
              </div>
              <div class="tab-pane fade" id="tabVung">
                <div id="vungNguyenLieuList" class="list-group"></div>
                <form id="vungNguyenLieuForm" class="row g-2 mt-3">
                  <div class="col-md-3"><input class="form-control" name="ma" placeholder="Mã" required /></div>
                  <div class="col-md-6"><input class="form-control" name="ten" placeholder="Tên" required /></div>
                  <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Thêm</button></div>
                </form>
              </div>
              <div class="tab-pane fade" id="tabLoaiNguyenLieu">
                <div id="loaiNguyenLieuList" class="list-group"></div>
                <form id="loaiNguyenLieuForm" class="row g-2 mt-3">
                  <div class="col-md-3"><input class="form-control" name="ma" placeholder="Mã" required /></div>
                  <div class="col-md-6"><input class="form-control" name="ten" placeholder="Tên" required /></div>
                  <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Thêm</button></div>
                </form>
              </div>
              <div class="tab-pane fade" id="tabLoaiSanPham">
                <div id="loaiSanPhamList" class="list-group"></div>
                <form id="loaiSanPhamForm" class="row g-2 mt-3">
                  <div class="col-md-3"><input class="form-control" name="ma" placeholder="Mã" required /></div>
                  <div class="col-md-6"><input class="form-control" name="ten" placeholder="Tên" required /></div>
                  <div class="col-md-3"><button class="btn btn-primary w-100" type="submit">Thêm</button></div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="./js/settingsPage.js"></script>
    <script type="module" src="./js/logout.js?v=20260804-7"></script>
  </body>
</html>
