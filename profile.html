<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Production Data Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
  </head>
  <body class="dashboard-page">
    <div class="d-flex min-vh-100">
      <aside class="sidebar bg-dark text-white p-4">
        <div class="mb-4">
          <h2 class="h5 fw-bold">Production Data</h2>
          <p class="text-secondary small mb-0">Quản lý nhập liệu sản xuất</p>
        </div>

        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link active" href="./profile.html">Profile</a>
          <a class="nav-link" href="#" data-action="logout">Đăng xuất</a>
           <a class="nav-link" href="./history.html">Lịch sử thao tác</a>
        </nav>
      </aside>

      <main class="flex-grow-1 bg-light p-4">
        <header class="mb-4">
          <h1 class="h3 fw-bold mb-1">Hồ sơ cá nhân</h1>
          <p class="text-muted">Cập nhật thông tin chi tiết và hình ảnh đại diện.</p>
        </header>

        <div class="row g-4">
          <div class="col-lg-4">
            <div class="card border-0 shadow-sm rounded-4">
              <div class="card-body text-center">
                <div class="avatar-circle mx-auto mb-3" id="profileAvatarPreview">U</div>
                <h2 class="h5 fw-semibold" id="profileDisplayName">-</h2>
                <p class="text-muted mb-3" id="profileDisplayEmail">-</p>
                <label class="btn btn-outline-primary btn-sm" for="avatarFile">Tải avatar mới</label>
                <input id="avatarFile" type="file" accept="image/*" class="d-none" />
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card border-0 shadow-sm rounded-4">
              <div class="card-body">
                <form id="profileForm" novalidate>
                  <div class="row g-3">
                    <div class="col-md-6">
                      <label for="profileName" class="form-label">Họ và tên</label>
                      <input id="profileName" type="text" class="form-control" required />
                    </div>
                    <div class="col-md-6">
                      <label for="profileDepartment" class="form-label">Phòng ban</label>
                      <input id="profileDepartment" type="text" class="form-control" required />
                    </div>
                  </div>
                  <div class="mt-3">
                    <label for="profileEmail" class="form-label">Email</label>
                    <input id="profileEmail" type="email" class="form-control" disabled />
                  </div>
                  <div class="mt-3">
                    <label for="profileRole" class="form-label">Vai trò</label>
                    <input id="profileRole" type="text" class="form-control" disabled />
                  </div>
                  <div class="mt-4 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Lưu thay đổi</button>
                    <a href="./dashboard.html" class="btn btn-outline-secondary">Quay lại</a>
                  </div>
                </form>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./js/profile.js"></script>
    <script type="module" src="./js/logout.js"></script>
  </body>
</html>
