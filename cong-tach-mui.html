<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Công tách múi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://unpkg.com/tabulator-tables@5.5.4/dist/css/tabulator.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="./css/style.css" />
    <link rel="stylesheet" href="./css/dashboard.css" />
    <link rel="stylesheet" href="./css/cong-tach-mui.css" />
  </head>
  <body class="dashboard-page">
    <div class="d-flex min-vh-100">
      <aside class="sidebar bg-dark text-white p-4">
        <div class="mb-4"><h2 class="h5 fw-bold">Production Data</h2><p class="text-secondary small mb-0">Quản lý nhập liệu sản xuất</p></div>
        <nav class="nav flex-column gap-2">
          <a class="nav-link" href="./dashboard.html">Dashboard</a>
          <a class="nav-link" href="./production.html">Nhập liệu sản xuất</a>
          <a class="nav-link active" href="./cong-tach-mui.html">Công tách múi</a>
          <a class="nav-link" href="./profile.html">Profile</a>
          <a class="nav-link admin-only" href="./settings.html" data-admin-only-link>⚙ Quản lý danh mục</a>
          <a class="nav-link" href="#" data-action="logout">Đăng xuất</a>
        </nav>
      </aside>
      <main class="flex-grow-1 bg-light p-3 p-lg-4">
        <header class="d-flex flex-column flex-lg-row justify-content-between align-items-start align-items-lg-center gap-3 mb-4">
          <div><p class="text-muted mb-1">Trang nhập liệu theo tổ</p><h1 class="h3 fw-bold mb-0">Công tách múi</h1></div>
          <div class="toolbar-actions"><span id="topRealtimeClock" class="small text-muted">--</span><span class="badge text-bg-light border" id="teamBadge">Đang tải tổ...</span><button class="btn btn-outline-secondary btn-sm" id="refreshBtn">Refresh</button><button class="btn btn-outline-success btn-sm" id="exportBtn">Xuất Excel</button></div>
        </header>
        <section class="card border-0 shadow-sm rounded-4 mb-3 compact-form">
          <div class="card-body p-3 p-lg-4">
            <div class="row g-3 align-items-end">
              <div class="col-12 col-md-6 col-lg-2"><label class="form-label small mb-1" for="productionDate">Ngày tháng</label><input id="productionDate" class="form-control form-control-sm" type="date" disabled required /></div>
              <div class="col-12 col-md-6 col-lg-3"><label class="form-label small mb-1" for="teamSelect">Tổ</label><select id="teamSelect" class="form-select form-select-sm"></select></div>
              <div class="col-12 col-md-6 col-lg-3"><label class="form-label small mb-1" for="processOne">Công đoạn 1</label><select id="processOne" class="form-select form-select-sm"><option value="">-- Chọn công đoạn --</option></select></div>
              <div class="col-12 col-md-6 col-lg-2"><label class="form-label small mb-1" for="processTwo">Công đoạn 2</label><select id="processTwo" class="form-select form-select-sm"><option value="">-- Chọn --</option></select></div>
              <div class="col-12 col-md-6 col-lg-2"><label class="form-label small mb-1" for="itemType">Loại</label><select id="itemType" class="form-select form-select-sm"><option value="">-- Chọn loại --</option></select></div>
              <div class="col-12 col-md-6 col-lg-4"><label class="form-label small mb-1" for="note">Thông tin thêm</label><input id="note" class="form-control form-control-sm" placeholder="Không bắt buộc" /></div>
              <div class="col-12 col-md-6 col-lg-2"><label class="form-label small mb-1" for="activeShift">Ca hiện tại</label><select id="activeShift" class="form-select form-select-sm" required><option value="">-- Chọn ca --</option><option value="morning">Ca sáng</option><option value="afternoon">Ca chiều</option><option value="evening">Ca tối</option></select></div>
              <div class="col-12 col-md-6 col-lg-2"><label class="form-label small mb-1" for="shiftPeople">Số người</label><input id="shiftPeople" class="form-control form-control-sm" type="number" min="0" step="1" /></div>
              <div class="col-12 col-md-6 col-lg-2"><label class="form-label small mb-1" for="shiftHours">Số giờ</label><input id="shiftHours" class="form-control form-control-sm" type="number" min="0" step="0.5" /></div>
              <div class="col-12 col-md-6 col-lg-2"><label class="form-label small mb-1" for="shiftBtp">BTP ca hiện tại</label><input id="shiftBtp" class="form-control form-control-sm" type="number" min="0" step="0.01" /></div>
              <div class="col-12 col-lg-2"><button class="btn btn-outline-primary btn-sm w-100" id="addRowBtn">Thêm dòng</button></div>
              <div class="col-12 col-lg-2"><button class="btn btn-outline-danger btn-sm w-100" id="deleteRowBtn">Xóa dòng</button></div>
            </div>
          </div>
        </section>
        <section class="card border-0 shadow-sm rounded-4 p-2 table-card"><div id="congTachMuiTable" class="table-scroll"></div></section>
      </main>
    </div>
    <script src="https://unpkg.com/tabulator-tables@5.5.4/dist/js/tabulator.min.js"></script>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
    <script type="module" src="./js/congTachMui.js"></script>
    <script type="module" src="./js/logout.js"></script>
  </body>
</html>
